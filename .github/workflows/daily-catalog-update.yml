name: Daily catalog update preview

on:
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview-update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run sample-feed update preview
        run: node scripts/update-catalog.js --mode preview --feed fixtures/daily-update-feed.json --report artifacts/daily-update-report.json --snapshot artifacts/catalog-update-preview.json

      - name: Test production publishing safeguards
        run: node scripts/tests/catalog-publishing.test.js

      - name: Test Step 4 pipeline and public integration
        run: node scripts/tests/step4.test.js

      - name: Test Step 5 monitoring and Step 6 launch readiness
        run: |
          node scripts/tests/price-monitoring.test.js
          node scripts/tests/launch-readiness.test.js

      - name: Upload update report and preview
        uses: actions/upload-artifact@v4
        with:
          name: daily-catalog-update-preview
          path: |
            artifacts/daily-update-report.json
            artifacts/catalog-update-preview.json
          if-no-files-found: error
          retention-days: 14
